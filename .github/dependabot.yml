version: 2

# Weekly grouped PRs. cooldown skips releases younger than a week, giving a
# compromised release time to be pulled. Security updates are not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope # "ci(deps): ..."
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope # "chore(deps): ...", "chore(deps-dev): ..."
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need code changes; take them by hand. Security updates still open PRs.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
