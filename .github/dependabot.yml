version: 2

# Weekly grouped PRs. cooldown skips releases younger than a week, giving a
# compromised release time to be pulled. Security updates are not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope # "ci(deps): ..."
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope # "chore(deps): ...", "chore(deps-dev): ..."
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the runtime Node.js major (.nvmrc); bump it by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
