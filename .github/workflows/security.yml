name: Security

on:
  pull_request:
  # Monthly: new rules and leak patterns apply to unchanged code.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Scanners run from images pinned by digest; bump tag and digest together.
env:
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  scan:
    name: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks sees every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v

      - name: Semgrep
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error
          --severity ERROR --severity WARNING
          --config p/typescript --config p/react --config p/nextjs --config p/github-actions

      # Online audits (impostor commits, known-vulnerable actions) need a
      # token, so they run only outside pull_request events.
      - name: zizmor (online)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/src:ro" "$ZIZMOR_IMAGE" --min-severity medium /src

      - name: zizmor (offline)
        if: github.event_name == 'pull_request'
        run: docker run --rm -v "$PWD:/src:ro" "$ZIZMOR_IMAGE" --offline --min-severity medium /src
